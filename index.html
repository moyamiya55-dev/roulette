<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ▼▼ 매일 여기 한 줄만 바꾸세요 (띄어쓰기로 구분, 10개) ▼▼ -->
<script>var TODAY="PDC SMX GMEX VWAV XXII AIAI WETO BNAI YFOR LICN";</script>
<!-- ▲▲ 여기까지 ▲▲ -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 급등 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
/* VOICE: 카지노 쇼 — 시끄럽고 반짝이고 신나게
   IDEA: 라스베이거스 무대의 돈 룰렛, 천장에서 지폐가 쏟아짐
   PICTURE: 금테 두른 10칸 원판이 화면 중앙을 꽉 채움
   COLOUR and TYPE: 짙은 지폐 초록 바탕, 금색, 빨간 포인터 / Black Han Sans + Do Hyeon
   LAYOUT: 제목 → 원판(주인공) → 결과 → 티커 입력 */
:root{color-scheme:light dark;--bg:light-dark(#0d4a34,#062619);--bg2:light-dark(#0a3a29,#041a11);--gold:#f5c542;--gold2:#b8860b;--red:#e0262b;--ink:#fff8e1;--muted:light-dark(#cfe8d6,#a9c9b3)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,var(--bg) 0%,var(--bg2) 75%);color:var(--ink);font:17px/1.55 "Do Hyeon",system-ui,sans-serif;overflow-x:clip}
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:clamp(20px,4vw,40px) 16px 48px;display:flex;flex-direction:column;align-items:center;gap:18px}
h1{margin:0;font:400 clamp(34px,7vw,52px)/1.05 "Black Han Sans",sans-serif;color:var(--gold);text-align:center;text-shadow:0 3px 0 #7a5400,0 0 24px rgba(245,197,66,.45);text-wrap:balance}
.sub{margin:-8px 0 0;color:var(--muted);text-align:center}
.stage{position:relative;width:min(92vw,520px);aspect-ratio:1}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border-radius:50%}
.pin{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:44px;height:58px;z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));pointer-events:none}
.hub{position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 45%,var(--gold2));color:#3b2a00;font:400 clamp(18px,4vw,26px) "Black Han Sans",sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.2);z-index:3}
.hub:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hub:disabled{cursor:default;filter:saturate(.7)}
.result{min-height:92px;text-align:center}
.result .lab{color:var(--muted);font-size:17px}
.result .win{font:400 clamp(44px,11vw,76px)/1 "Black Han Sans",sans-serif;color:var(--gold);text-shadow:0 4px 0 #7a5400,0 0 30px rgba(245,197,66,.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.panel{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(245,197,66,.35);border-radius:16px;padding:16px}
.panel label{display:block;margin-bottom:8px;font-size:18px}
textarea{width:100%;min-height:84px;resize:vertical;border-radius:10px;border:1px solid rgba(245,197,66,.5);background:rgba(0,0,0,.35);color:var(--ink);font:16px/1.5 "Do Hyeon",sans-serif;padding:10px 12px;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
button.b{min-height:44px;padding:0 18px;border-radius:10px;border:0;font:18px "Do Hyeon",sans-serif;cursor:pointer;background:var(--gold);color:#3b2a00}
button.g{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.35)}
.note{color:var(--muted);font-size:14px}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hist span{background:rgba(245,197,66,.15);border:1px solid rgba(245,197,66,.4);border-radius:999px;padding:2px 12px;font-size:15px}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<main>
  <h1>오늘의 급등 룰렛</h1>
  <p class="sub">원판이나 가운데 버튼을 누르면 돌아가요</p>
  <div class="stage">
    <svg class="pin" viewBox="0 0 44 58" aria-hidden="true"><path d="M22 56 L4 16 A18 18 0 1 1 40 16 Z" fill="#e0262b" stroke="#fff3b0" stroke-width="3"/><circle cx="22" cy="18" r="7" fill="#fff3b0"/></svg>
    <canvas id="wheel" aria-label="룰렛 원판"></canvas>
    <button class="hub" id="hub" type="button">SPIN</button>
  </div>
  <div class="result" id="result" aria-live="polite"><div class="lab">오늘의 운명은?</div></div>
  <p class="note" id="src" style="margin:0">오늘의 종목</p>
  <p class="note" style="margin:-14px 0 0">매일 오전 갱신됩니다</p>
  <p class="note">재미용이라 투자 판단과는 무관합니다.</p>
</main>
<script>
{
const SAMPLE=['NVDA','TSLA','PLTR','SOFI','RKLB','IONQ','HOOD','MSTR','SMCI','AMD'];
const COLORS=['#e0262b','#0e5c3f','#f5c542','#123d8a','#e0262b','#0e5c3f','#f5c542','#123d8a','#8a1fa0','#0e5c3f'];
const wc=document.getElementById('wheel'),wx=wc.getContext('2d');
const res=document.getElementById('result'),hub=document.getElementById('hub'),hist=document.getElementById('hist');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let items=[],rot=0,spinning=false,history=[],lastSeg=-1,actx=null;

function parse(t){return t.toUpperCase().split(/[\s,;\/|]+/).map(s=>s.replace(/[^A-Z0-9.\-가-힣]/g,'')).filter(Boolean).slice(0,10)}
let pending=null;
function load(){const l=parse(String(window.TODAY||''));items=l.length>=2?l:SAMPLE;draw()}
function setItems(l){items=l;draw()}
function draw(){
  const r=wc.getBoundingClientRect(),d=devicePixelRatio||1,S=Math.round(r.width*d);
  if(wc.width!==S){wc.width=S;wc.height=S}
  const c=S/2,R=c*0.96,n=items.length,seg=Math.PI*2/n;
  wx.clearRect(0,0,S,S);
  // 금테
  let g=wx.createRadialGradient(c,c,R*0.9,c,c,R);g.addColorStop(0,'#b8860b');g.addColorStop(.5,'#fff3b0');g.addColorStop(1,'#8a6200');
  wx.fillStyle=g;wx.beginPath();wx.arc(c,c,R,0,Math.PI*2);wx.fill();
  const IR=R*0.9;
  for(let i=0;i<n;i++){
    const a0=rot+i*seg,a1=a0+seg;
    wx.beginPath();wx.moveTo(c,c);wx.arc(c,c,IR,a0,a1);wx.closePath();
    wx.fillStyle=COLORS[i%COLORS.length];wx.fill();
    wx.strokeStyle='rgba(255,243,176,.9)';wx.lineWidth=2*d;wx.stroke();
    wx.save();wx.translate(c,c);wx.rotate(a0+seg/2);
    const dark=COLORS[i%COLORS.length]==='#f5c542';
    wx.fillStyle=dark?'#3b2a00':'#fff8e1';
    let fs=Math.min(IR*0.13,IR*1.1/Math.max(items[i].length,4));
    wx.font=fs+'px "Black Han Sans",sans-serif';wx.textAlign='right';wx.textBaseline='middle';
    wx.shadowColor='rgba(0,0,0,.35)';wx.shadowBlur=4*d;
    wx.fillText(items[i],IR*0.9,0);
    wx.restore();
  }
  // 전구
  const B=24;
  for(let i=0;i<B;i++){const a=i/B*Math.PI*2,on=(Math.floor(performance.now()/180)+i)%2===0||!spinning;
    wx.beginPath();wx.arc(c+Math.cos(a)*R*0.95,c+Math.sin(a)*R*0.95,R*0.022,0,Math.PI*2);
    wx.fillStyle=on?'#fffbe0':'#9a7400';wx.shadowColor='#fff3b0';wx.shadowBlur=on?10*d:0;wx.fill();wx.shadowBlur=0}
}
function idxAt(){const n=items.length,seg=Math.PI*2/n;let a=(-Math.PI/2-rot)%(Math.PI*2);if(a<0)a+=Math.PI*2;return Math.floor(a/seg)%n}
function tick(){if(!actx)return;try{const o=actx.createOscillator(),v=actx.createGain();o.frequency.value=1400;v.gain.setValueAtTime(.08,actx.currentTime);v.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.04);o.connect(v);v.connect(actx.destination);o.start();o.stop(actx.currentTime+.05)}catch(e){}}

function spin(){
  if(spinning||items.length<2)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  spinning=true;hub.disabled=true;res.innerHTML='<div class="lab">돌아가는 중…</div>';
  const start=rot,dist=Math.PI*2*(reduce?2:6+Math.random()*3)+Math.random()*Math.PI*2,dur=reduce?1200:5200,t0=performance.now();
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);
    rot=start+dist*e;draw();
    const s=idxAt();if(s!==lastSeg){lastSeg=s;tick()}
    if(p<1)requestAnimationFrame(step);else done();
  };requestAnimationFrame(step);
}
function done(){
  spinning=false;hub.disabled=false;rot%=Math.PI*2;draw();
  const w=items[idxAt()];
  if(pending){const p=pending;pending=null;setTimeout(()=>setItems(p),2500)}
  res.innerHTML='<div class="lab">당첨!</div><div class="win"></div>';res.querySelector('.win').textContent=w;
  history.unshift(w);history=history.slice(0,8);
  hist.innerHTML=history.map(()=>'<span></span>').join('');[...hist.children].forEach((el,i)=>el.textContent=(i?'':'방금 ')+history[i]);
  burst();
}
wc.addEventListener('click',spin);hub.addEventListener('click',spin);
const ro=new ResizeObserver(()=>draw());ro.observe(wc);

// ===== 돈비 =====
const rc=document.getElementById('rain'),rx=rc.getContext('2d');let P=[],W=0,H=0,boost=0;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;rc.width=W*d;rc.height=H*d;rx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
function mk(top){const coin=Math.random()<.3;return{x:Math.random()*W,y:top?-40-Math.random()*H*0.6:Math.random()*H,vy:1.2+Math.random()*2.2,vx:(Math.random()-.5)*.8,r:Math.random()*6.28,vr:(Math.random()-.5)*.08,ph:Math.random()*6.28,s:.7+Math.random()*.6,coin}}
function burst(){if(reduce)return;boost=1;for(let i=0;i<140;i++){const p=mk(true);p.vy+=2;P.push(p)}}
for(let i=0;i<(reduce?0:28);i++)P.push(mk(false));
function bill(p){const w=46*p.s,h=22*p.s,flip=Math.cos(p.ph);
  rx.save();rx.translate(p.x,p.y);rx.rotate(p.r);rx.scale(1,Math.abs(flip)*.8+.2);
  rx.fillStyle=flip>0?'#7cc47f':'#5aa55f';rx.fillRect(-w/2,-h/2,w,h);
  rx.strokeStyle='#2f6b33';rx.lineWidth=1.5;rx.strokeRect(-w/2+3,-h/2+3,w-6,h-6);
  rx.fillStyle='#1f4d23';rx.font='bold '+(14*p.s)+'px sans-serif';rx.textAlign='center';rx.textBaseline='middle';rx.fillText('$',0,1);
  rx.restore()}
function coin(p){const r=9*p.s,sx=Math.abs(Math.cos(p.ph))*.85+.15;
  rx.save();rx.translate(p.x,p.y);rx.scale(sx,1);
  const g=rx.createRadialGradient(-r*.3,-r*.3,1,0,0,r);g.addColorStop(0,'#fff3b0');g.addColorStop(.6,'#f5c542');g.addColorStop(1,'#a87a00');
  rx.fillStyle=g;rx.beginPath();rx.arc(0,0,r,0,6.28);rx.fill();
  rx.fillStyle='#8a6200';rx.font='bold '+(r*1.1)+'px sans-serif';rx.textAlign='center';rx.textBaseline='middle';rx.fillText('$',0,1);rx.restore()}
function loop(){
  rx.clearRect(0,0,W,H);
  for(const p of P){p.ph+=.06;p.y+=p.vy;p.x+=p.vx+Math.sin(p.ph)*.9;p.r+=p.vr;p.coin?coin(p):bill(p)}
  P=P.filter(p=>p.y<H+50);
  const base=reduce?0:28;while(P.length<base)P.push(mk(true));
  if(spinning)draw();
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
document.fonts&&document.fonts.ready.then(draw);
load();
}
</script>
</body>
</html>
